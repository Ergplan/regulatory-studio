# Copy to ~/.cloudflared/regstudio.yml on the Mac mini and fill in the three marked values.
# Create the tunnel first (this signs in to your Cloudflare account in the browser and writes
# the credentials file; do it yourself, the file is a secret and stays on the Mac):
#   cloudflared tunnel login
#   cloudflared tunnel create regstudio
#   cloudflared tunnel route dns regstudio review.YOUR-DOMAIN
tunnel: TUNNEL-ID                                              # printed by "tunnel create"
credentials-file: /Users/YOUR-USER/.cloudflared/TUNNEL-ID.json
ingress:
  - hostname: review.YOUR-DOMAIN
    service: http://127.0.0.1:8765                             # the review screen; nothing else is exposed
  - service: http_status:404
