<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Review{% endblock %} · Regulatory Studio</title>
<style>
.impact-edit{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}.impact-edit td,.impact-edit th{padding:4px;border-bottom:1px solid var(--line);text-align:left}.impact-edit input{width:100%}
:root{--ink:#1d2330;--quiet:#5b6475;--line:#d9dde5;--bg:#f7f8fa;--card:#fff;--accent:#1f5fbf;--good:#1d7a46;--bad:#b3261e;--warn:#9a6700}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;gap:16px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header a{color:var(--ink);text-decoration:none;font-weight:600}header .who{margin-left:auto;color:var(--quiet)}
main{padding:20px;max-width:1400px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:24px 0 8px}
.muted{color:var(--quiet)}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:var(--card)}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--quiet);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.pill.approved{color:var(--good);border-color:var(--good)}.pill.rejected{color:var(--bad);border-color:var(--bad)}.pill.proposed{color:var(--warn);border-color:var(--warn)}
button{font:inherit;padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.good{color:var(--good);border-color:var(--good)}button.bad{color:var(--bad);border-color:var(--bad)}
input,select,textarea{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;width:100%;background:#fff}
textarea{min-height:90px}label{display:block;font-size:12px;color:var(--quiet);margin:8px 0 3px}
.inline{display:inline}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flash{padding:10px;border-radius:6px;background:#fff4e5;border:1px solid #f0c36d;margin-bottom:12px}
</style>{% block head %}{% endblock %}</head>
<body><header><a href="/">Regulatory Studio · Review</a><a href="/memory" style="font-weight:400">Memory</a><span class="muted">Nothing is published until approved here</span>
<span class="who">{% if reviewer %}Reviewing as <b>{{ reviewer }}</b> · <a href="/logout">sign out</a>{% else %}No reviewer set{% endif %}</span></header>
<main>{% block body %}{% endblock %}</main></body></html>
