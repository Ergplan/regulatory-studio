name: ci
on: [push, pull_request]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "pipeline[test]"
      - run: pytest -q pipeline/tests
        env: { REGSTUDIO_READER: mock }
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e pipeline
      - name: Build a SAMPLE snapshot (never committed)
        run: ops/sample_snapshot.sh "$RUNNER_TEMP/rs"
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
        env: { SNAPSHOT_DIR: "${{ runner.temp }}/rs/snapshot", NEXT_TELEMETRY_DISABLED: "1" }
